<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skull Kap Studios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container header-container">
            <div class="logo-container">
                <div class="logo-text">WEBSITE<br>LOGO HERE</div>
                <h1 class="site-title" id="site-title">SKULL KAP STUDIOS</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="instruments.html" id="nav-instruments">INSTRUMENTS</a></li>
                    <li><a href="software.html" id="nav-software">SOFTWARE</a></li>
                    <li><a href="studios.html" id="nav-studios">STUDIOS</a></li>
                    <li><a href="about.html" id="nav-about">ABOUT ME</a></li>
                    <li><button class="btn-login" id="btn-login">SIGN UP/LOG IN</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container" id="main-content">
        <!-- Content will be loaded here dynamically -->
    </main>

    <!-- Login/Signup Modal -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <span class="close" id="close-modal">&times;</span>
            <h2 class="modal-title">Sign Up / Log In</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Log In</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
