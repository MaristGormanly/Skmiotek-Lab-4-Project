<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skull Kap Studios</title>
    <link rel="stylesheet" type="text/css" href="/client/public/css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1 id="site-title">SKULL KAP STUDIOS</h1>
            <nav>
                <a href="#" id="nav-instruments">INSTRUMENTS</a>
                <a href="#" id="nav-software">SOFTWARE</a>
                <a href="#" id="nav-studios">STUDIOS</a>
                <a href="#" id="nav-about">ABOUT</a>
            </nav>
            <button id="btn-login">LOGIN</button>
        </div>
    </header>

    <main id="main-content">
        <!-- Content loaded dynamically via JavaScript -->
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2025 Skull Kap Studios. All rights reserved.</p>
        </div>
    </footer>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close-button">&times;</span>
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" id="btn-submit">Login</button>
                    <button type="button" id="btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
