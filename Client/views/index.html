<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skull Kap Studios</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-container">
                <a href="#" id="nav-home" class="site-title">SKULL KAP STUDIOS</a>
            </div>
            <nav>
                <a href="#" id="nav-instruments">INSTRUMENTS</a>
                <a href="#" id="nav-software">SOFTWARE</a>
                <a href="#" id="nav-studios">STUDIOS</a>
                <a href="#" id="nav-connect">CONNECT</a> 
                <a href="#" id="nav-about">ABOUT</a>
            </nav>
            <button id="auth-button" class="auth-btn">Signup/Login</button>
        </div>
    </header>

    <main id="main-content">

    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2025 Skull Kap Studios. All rights reserved.</p>
        </div>
    </footer>

    <!-- Login Modal -->
<div id="login-modal" class="modal">
    <div class="modal-content">
      <span id="close-modal" class="close">&times;</span>
      <h2 class="modal-title">Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required />
        </div>
        <div class="modal-buttons">
          <button type="submit" class="btn btn-primary">Login</button>
          <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
        </div>
        <p class="switch-modal-text">
          Don’t have an account? <a href="#" id="open-signup">Sign up</a>
        </p>
      </form>
    </div>
  </div>
  
  <!-- Sign Up Modal -->
  <div id="signup-modal" class="modal">
    <div class="modal-content">
      <span id="close-signup-modal" class="close">&times;</span>
      <h2 class="modal-title">Create Account</h2>
      <form id="signup-form">
        <div class="form-group">
          <label for="signup-username">Username:</label>
          <input type="text" id="signup-username" name="signup-username" required />
        </div>
        <div class="form-group">
          <label for="signup-email">Email:</label>
          <input type="email" id="signup-email" name="signup-email" required />
        </div>
        <div class="form-group">
          <label for="signup-password">Password:</label>
          <input type="password" id="signup-password" name="signup-password" required />
        </div>
        <div class="modal-buttons">
          <button type="submit" class="btn btn-primary">Sign Up</button>
          <button type="button" class="btn btn-secondary" id="btn-signup-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  

    <script src="/js/main.js"></script>
</body>
</html>
