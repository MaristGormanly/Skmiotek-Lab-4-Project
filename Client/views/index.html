<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skull Kap Studios</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-container">
                <h1 class="site-title">SKULL KAP STUDIOS</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="#" id="nav-instruments">INSTRUMENTS</a></li>
                    <li><a href="#" id="nav-software">SOFTWARE</a></li>
                    <li><a href="#" id="nav-studios">STUDIOS</a></li>
                    <li><a href="#" id="nav-about">ABOUT</a></li>
                </ul>
            </nav>
            <button class="btn-login">LOGIN</button>
        </div>
    </header>

    <main id="main-content">
        
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2025 Skull Kap Studios. All rights reserved.</p>
        </div>
    </footer>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h2 class="modal-title">Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Login</button>
                    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
