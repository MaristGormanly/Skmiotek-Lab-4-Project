<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skull Kap Studios</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header Styles */
        header {
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-text {
            font-size: 14px;
            color: #999;
            margin-right: 20px;
        }

        .site-title {
            font-size: 24px;
            font-weight: bold;
            color: #ff3333;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #ff3333;
        }

        .btn-login {
            background-color: #ff3333;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .btn-login:hover {
            background-color: #cc0000;
        }

        /* Page Title Styles */
        .page-title {
            font-size: 36px;
            margin: 40px 0;
            font-weight: normal;
            letter-spacing: 2px;
        }

        /* Content Section Styles */
        .content-section {
            margin-bottom: 60px;
        }

        .section-title {
            background-color: #333;
            color: #fff;
            padding: 10px 15px;
            display: inline-block;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .content-box {
            background-color: #222;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
        }

        /* Grid Layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Software Page Styles */
        .software-item {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Instrument Page Styles */
        .instrument-item {
            display: flex;
            flex-direction: column;
        }

        .instrument-image {
            height: 150px;
            background-color: #333;
            margin-bottom: 15px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        /* About Page Styles */
        .about-images {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-top: 30px;
        }

        .about-image {
            height: 150px;
            background-color: #333;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #222;
            padding: 30px;
            border-radius: 5px;
            width: 100%;
            max-width: 400px;
        }

        .modal-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #ff3333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            border-radius: 3px;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-primary {
            background-color: #ff3333;
            color: #fff;
        }

        .btn-secondary {
            background-color: #333;
            color: #fff;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #fff;
        }

        @media (max-width: 768px) {
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .software-item {
                grid-template-columns: 1fr;
            }
            
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }
            
            nav ul {
                margin-top: 20px;
                flex-wrap: wrap;
            }
            
            nav ul li {
                margin: 0 10px 10px 0;
            }
        }

        @media (max-width: 576px) {
            .grid-2, .grid-4 {
                grid-template-columns: 1fr;
            }
            
            .about-images {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container header-container">
            <div class="logo-container">
                <div class="logo-text">WEBSITE<br>LOGO HERE</div>

            </div>
            <nav>

    </header>

    <!-- Main Content -->
    <main class="container" id="main-content">
        <!-- Content will be loaded here dynamically -->

    <div class="modal" id="login-modal">
        <div class="modal-content">

            <h2 class="modal-title">Sign Up / Log In</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Log In</button>
                </div>
            </form>
        </div>
    </div>

</html>
